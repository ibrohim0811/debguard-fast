worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Rate limit zonalari
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=scan_zone:10m rate=1r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream devguard_backend {
        server web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 5m;
        client_body_timeout 15s;
        client_header_timeout 15s;

        limit_conn conn_limit 20;

        location ~ ^/scan-web/(audit|ddos)$ {
            limit_req zone=scan_zone burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://devguard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location ~ ^/(login|register|auth) {
            limit_req zone=auth_zone burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://devguard_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(check-payment|my-transaction) {
            limit_req zone=general_zone burst=10 nodelay;

            proxy_pass http://devguard_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=general_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://devguard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        location /staticfiles/ {
            alias /app/staticfiles/;
            expires 30d;
            access_log off;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
    }
}