name: Deploy Devguard to VPS

on:
  push:
    branches:
      - main  # yoki master (qaysi tarmoq ishlatilayotgan bo'lsa)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # Agarda .git bo'lmasa, papkani tozalab noldan clone qilamiz
            if [ ! -d "$HOME/devguard/.git" ]; then
              rm -rf ~/devguard
              git clone https://github.com/${{ github.repository }}.git ~/devguard
              cd ~/devguard
            else
              cd ~/devguard
              git fetch origin main
              git reset --hard origin/main
            fi

            # Docker konteynerlarni build qilib qayta ishga tushiramiz
            docker compose down || true
            docker compose build
            docker compose up -d